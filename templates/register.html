<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCT ANALYZER V2 - Registo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full space-y-8 bg-slate-900/90 p-8 rounded-2xl border border-slate-800 shadow-2xl backdrop-blur-xl">
        <!-- Cabeçalho -->
        <div class="text-center">
            <h1 class="text-2xl font-bold tracking-wider text-slate-100">NCT ANALYZER V2</h1>
            <p class="text-xs text-indigo-400 font-semibold tracking-widest mt-1 uppercase">ONLINE · MARKET INTELLIGENCE</p>
            <h2 class="mt-6 text-xl font-semibold text-slate-200">Criar sua conta</h2>
            <p class="mt-1 text-xs text-slate-400">Cadastre-se para configurar seu próprio painel de análise.</p>
        </div>

       

        <!-- Formulário de Registo -->
    
        <form class="mt-6 space-y-6" action="{{ url_for('register') }}" method="POST">
            <div class="space-y-4">
                <div>
                    <label for="email" class="block text-xs font-medium text-slate-300 mb-1">E-mail</label>
                    <input id="email" name="email" type="email" required 
                        class="appearance-none rounded-xl relative block w-full px-4 py-3 bg-slate-950 border border-slate-800 placeholder-slate-500 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition-all duration-200" 
                        placeholder="seu@email.com">
                </div>
               <!-- Campo Senha com Olhinho -->
<div>
    <label for="password" class="block text-xs font-medium text-slate-300 mb-1">Criar senha</label>
    <div class="relative">
        <input id="password" name="password" type="password" required
               class="appearance-none rounded-xl relative block w-full pl-4 pr-12 py-3 bg-slate-950 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
               placeholder="Mínimo de 12 caracteres">
        <!-- Botão do Olhinho 1 -->
        <button type="button" onclick="togglePassword('password', 'eye-icon-1')" class="absolute right-3 top-3.5 text-gray-400 hover:text-white">
            <svg id="eye-icon-1" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
        </button>
    </div>
    <p class="mt-1 text-[11px] text-slate-500">Utilize uma senha exclusiva e difícil de adivinhar.</p>
</div>

<!-- Confirmar Senha com Olhinho -->
        <div class="mt-4">
            <label for="confirm_password" class="block text-xs font-medium text-slate-300 mb-1">Confirmar senha</label>
            <div class="relative">
                <input id="confirm_password" name="confirm_password" type="password" required
                       class="appearance-none rounded-xl relative block w-full pl-4 pr-12 py-3 bg-slate-950 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                       placeholder="Digite a senha novamente">
                <!-- Botão do Olhinho 2 -->
                <button type="button" onclick="togglePassword('confirm_password', 'eye-icon-2')" class="absolute right-3 top-3.5 text-gray-400 hover:text-white">
                    <svg id="eye-icon-2" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Botão de Finalizar Cadastro -->
        <div class="mt-6">
            <button type="submit"
                    class="w-full py-3 px-4 rounded-xl text-white bg-indigo-600 hover:bg-indigo-500 font-medium transition duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                Criar minha conta
            </button>
        </div>
    </form>
</div>

<!-- Link para voltar ao Login -->
<div class="mt-6 text-center text-xs text-slate-400">
    Já tem uma conta? 
    <a href="{{ url_for('login') }}" class="font-medium text-indigo-400 hover:text-indigo-300 hover:underline">
        Fazer login
    </a>
</div>

<!-- Script isolado corretamente dentro da tag script -->
<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    
    if (input.type === 'password') {
        input.type = 'text';
    } else {
        input.type = 'password';
    }
}
</script>
